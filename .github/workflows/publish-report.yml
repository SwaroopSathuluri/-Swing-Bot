name: Publish Swing Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13,18,23 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate reports and home page
        run: python build_pages_site.py

      - name: Prepare Pages artifact
        run: |
          mkdir site
          cp index.html site/index.html
          cp stocks.html site/stocks.html
          cp etfs.html site/etfs.html
          cp seasonality.html site/seasonality.html
          cp swing_trading_mag7_report.html site/swing_trading_mag7_report.html
          cp swing_trading_etf_report.html site/swing_trading_etf_report.html
          cp qqq_tqqq_seasonality.html site/qqq_tqqq_seasonality.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
